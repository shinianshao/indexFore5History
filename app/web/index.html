<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>古籍檢索 · 本地索引</title>
<style>
  /* 克制的古典：宣紙底 / 墨色字 / 朱砂點綴。不做豎排、印章、漢字數字——
     可讀性優先（docs/21 §12.4）。正文與書名用宋體，控件與數字用 sans。 */
  :root {
    --bg: #F7F4EC;      /* 宣紙 */
    --panel: #FFFDF7;   /* 面板，比底略亮 */
    --text: #2B2A27;    /* 墨 */
    --muted: #7A756B;   /* 淡墨 */
    --border: #DED8C8;  /* 版框線 */
    --accent: #9E3D32;  /* 朱砂 */
    --accent-soft: #F5E9E6;
    --place: #2f7d7d;   /* 地名：青碧，與人物的朱砂分色（與靜態版同值） */
    --place-soft: #e4f0f0;
    --serif: "Songti SC", "SimSun", "Source Han Serif SC", "Noto Serif CJK SC", serif;
    --sans: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--sans); font-size: 15px; line-height: 1.7;
  }
  header {
    padding: 24px 20px 14px; text-align: center; position: relative;
    border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header h1 {
    margin: 0; font-family: var(--serif); font-size: 21px;
    font-weight: 500; letter-spacing: 3px;
  }
  header .sub { margin: 4px 0 0; color: var(--muted); font-size: 12px; letter-spacing: 1px; }
  .backbtn {
    position: absolute; left: 18px; top: 22px; font-family: var(--sans);
    font-size: 13px; line-height: 1; background: transparent;
    border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 11px; color: var(--muted); cursor: pointer;
  }
  .backbtn:hover { border-color: var(--accent); color: var(--accent); }
  .backbtn[hidden] { display: none; }

  .wrap { max-width: 940px; margin: 0 auto; padding: 0 20px 60px; }
  .searchbar { display: flex; gap: 8px; margin: 22px 0 8px; }
  .searchbar input {
    flex: 1; padding: 9px 12px; font-family: var(--serif); font-size: 15px;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; outline: none;
  }
  .searchbar input:focus { border-color: var(--accent); }
  .searchbar button {
    padding: 9px 16px; font-family: var(--sans); font-size: 14px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  .modes { display: flex; gap: 6px; margin-bottom: 14px; }
  .modes span {
    padding: 5px 12px; font-size: 13px; border: 1px solid var(--border);
    border-radius: 8px; color: var(--muted); cursor: pointer; background: var(--panel);
  }
  .modes span.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px 18px; margin-bottom: 12px;
  }
  .row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 9px 0; border-bottom: 1px dashed var(--border); cursor: pointer;
  }
  .row:last-child { border-bottom: none; }
  .row:hover .name { color: var(--accent); }
  .row .name { font-family: var(--serif); font-size: 17px; }
  .row .meta { color: var(--muted); font-size: 12px; white-space: nowrap; }
  /* 同名異人消歧：序號徽章 + 「見於哪幾本書」（同名往往各屬一書） */
  .dup-idx {
    display: inline-block; font-family: var(--sans); font-size: 11px;
    min-width: 17px; text-align: center; line-height: 17px;
    background: var(--accent-soft); color: var(--accent);
    border-radius: 50%; margin-right: 7px; vertical-align: 2px;
  }
  .row .books { color: var(--accent); opacity: .75; }

  .person-head { display: flex; align-items: baseline; gap: 12px; }
  .person-head .name { font-family: var(--serif); font-size: 22px; }
  .person-head .dyn { color: var(--muted); font-size: 13px; }
  .alias-tag {
    display: inline-block; font-family: var(--serif); font-size: 13px;
    background: var(--accent-soft); color: var(--text);
    border-radius: 6px; padding: 2px 8px; margin: 3px 5px 0 0;
  }
  /* 完整稱謂表：分組 chips。
     虛線＝收錄了但本書不用（「未用」），青灰＝泛稱（不固定屬於誰）。
     泛稱刻意與人物的朱砂分色——它是「類別名」不是「這個人的專屬稱呼」。 */
  .alias-groups { margin-top: 10px; }
  .alias-group {
    display: flex; align-items: baseline; gap: 8px;
    padding: 3px 0; border-top: 1px dashed var(--border);
  }
  .alias-group:first-child { border-top: 0; }
  .alias-group .kind {
    flex: 0 0 auto; min-width: 8.5em; font-size: 12px; color: var(--muted);
    letter-spacing: .5px; cursor: help;
  }
  .alias-group .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .alias-group .chip {
    font-family: var(--serif); font-size: 13px; line-height: 1.5;
    background: var(--accent-soft); color: var(--text);
    border: 1px solid transparent; border-radius: 6px;
    padding: 1px 8px; cursor: help;
  }
  .alias-group .chip em {
    font-style: normal; font-family: var(--sans); font-size: 11px;
    color: var(--accent); margin-left: 5px;
  }
  .alias-group .chip.off { background: transparent; border-style: dashed; border-color: var(--border); color: var(--muted); }
  .alias-group .chip.off em { color: var(--muted); }
  .alias-group .chip.gen { background: var(--place-soft); }
  .alias-group .chip.gen em { color: var(--place); }
  .alias-note { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .summary { color: #6b6559; font-size: 14px; font-family: var(--serif); margin: 8px 0 0; }

  .chapter-title {
    font-family: var(--serif); font-size: 15px; font-weight: 500;
    margin: 16px 0 6px; color: var(--text);
    border-bottom: 1px solid var(--border); padding-bottom: 4px;
  }
  .sent {
    font-family: var(--serif); font-size: 15px; line-height: 1.95;
    padding: 5px 0 5px 14px; border-left: 2px solid var(--border);
    margin-bottom: 5px; cursor: pointer;
  }
  .sent:hover { border-left-color: var(--accent); background: #FBF9F5; }
  /* 命中：core 實線朱砂；推斷（guess 等）虛線 + 問號——一眼分出硬證據與推測 */
  .sent mark {
    background: transparent; color: var(--accent);
    border-bottom: 1.5px solid var(--accent); padding: 0 1px;
  }
  .sent mark.guess { border-bottom: 1.5px dashed var(--accent); color: var(--accent); }
  .tier-note { font-family: var(--sans); font-size: 11px; color: var(--muted); margin-left: 6px; }

  /* 關係列表（圖留到 P6-3，先能用即可） */
  .rel-list { margin-top: 6px; }
  .rel-row {
    display: flex; align-items: baseline; gap: 10px;
    padding: 7px 0; border-bottom: 1px dashed var(--border); cursor: pointer;
  }
  .rel-row:last-child { border-bottom: none; }
  .rel-row:hover .name { color: var(--accent); }
  .rel-row .rel {
    font-family: var(--serif); font-size: 13px; color: var(--accent);
    background: var(--accent-soft); border-radius: 6px; padding: 1px 8px;
  }
  .rel-row .name { font-family: var(--serif); font-size: 15px; }
  .rel-row .meta { color: var(--muted); font-size: 12px; }
  .rel-ev, .rel-noev { font-family: var(--sans); font-size: 11px; margin-left: auto; }
  .rel-ev { color: var(--accent); cursor: pointer; }
  .rel-noev { color: var(--muted); opacity: .7; }        /* 無證據＝推斷，要看得出來 */

  /* 關係卡片的三個旋鈕（一跳 / 二跳 / 只看有證據）——
     端點的四個密度參數以前一個都點不到，等於死參數（docs/28 P1-5） */
  .rel-knobs { margin-left: auto; display: flex; gap: 5px; }
  .knob {
    font-family: var(--sans); font-size: 11px; padding: 2px 9px;
    border: 1px solid var(--border); border-radius: 999px;
    color: var(--muted); background: var(--panel); cursor: pointer;
  }
  .knob.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

  /* 關係圖（P6-3）：自繪 SVG，不引外部圖庫。
     實線＝語料裡有證據句可跳；虛線＝取自簡介的推斷；朱砂＝當前人物。 */
  .rel-svg { display: block; margin: 4px auto 2px; }
  .rel-svg .rel-node { cursor: pointer; }
  .rel-svg .rel-node rect { fill: var(--panel); stroke: var(--border); }
  .rel-svg .rel-node text { font-family: var(--serif); font-size: 14px; fill: var(--text); }
  .rel-svg .rel-node:hover rect { stroke: var(--accent); }
  .rel-svg .rel-node.is-center rect { fill: var(--accent-soft); stroke: var(--accent); }
  .rel-svg .rel-node.is-center text { fill: var(--accent); }
  .rel-svg .rel-edge { cursor: pointer; }
  .rel-svg .rel-edge line { stroke: var(--accent); stroke-width: 1.2; opacity: .7; }
  .rel-svg .rel-edge.weak line { stroke: var(--muted); stroke-dasharray: 4 3; opacity: .85; }
  .rel-svg .rel-edge:hover line { stroke-width: 2.4; opacity: 1; }
  .rel-svg .rel-label { font-family: var(--serif); font-size: 12px; fill: var(--muted); }
  .rel-svg .rel-edge:hover .rel-label { fill: var(--accent); }

  .empty { color: var(--muted); font-size: 14px; padding: 22px 0; text-align: center; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .err { color: var(--accent); font-size: 13px; padding: 10px 0; }

  /* ---- 書切換條 ---- 視覺沿用靜態版 web/：膠囊按鈕 + 「選書」前綴 */
  .bookbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 22px 0 0; }
  .bookbar::before {
    content: "選書"; font-size: 12px; color: var(--muted);
    letter-spacing: 1px; margin-right: 2px;
  }
  .bk {
    display: inline-flex; align-items: baseline; gap: 6px; cursor: pointer; user-select: none;
    padding: 6px 13px; border: 1px solid var(--border); border-radius: 20px;
    background: var(--panel); color: var(--muted); font-family: var(--serif); font-size: 15px;
  }
  .bk:hover { border-color: var(--accent); color: var(--accent); }
  .bk.on {
    border-color: var(--accent); background: var(--accent-soft);
    color: var(--accent); font-weight: 600;
  }
  .bk.all { font-family: var(--sans); font-size: 13px; margin-left: 6px; }

  /* ---- 標籤頁 ---- 與靜態版同序：檢索結果 / 人物索引 / 地名索引 / 篇目一覽 */
  .tabs { display: flex; gap: 4px; margin: 18px 0 14px; border-bottom: 1px solid var(--border); }
  .tabs span {
    padding: 8px 16px; font-size: 14px; cursor: pointer; color: var(--muted);
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tabs span.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

  /* ---- 快捷詞 ---- 人物（朱砂）與地名（青碧）分色，一眼分辨兩類實體 */
  .quick { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .quick span {
    padding: 5px 12px; font-size: 13px; cursor: pointer;
    border: 1px solid var(--border); border-radius: 20px;
    background: var(--panel); color: var(--muted);
  }
  .quick span:hover { border-color: var(--accent); color: var(--accent); }
  .quick span.land { border-color: #cfe2e2; }
  .quick span.land:hover { border-color: var(--place); color: var(--place); }
  .quick i.sep { width: 1px; align-self: stretch; background: var(--border); margin: 2px 4px; }
  .quick .qn { font-weight: 400; color: #b8b3a8; font-size: 11px; margin-left: 5px; }

  /* ---- 索引面板 ---- */
  .group-title {
    margin: 26px 0 12px; font-size: 14px; font-weight: 600;
    color: var(--accent); letter-spacing: 1px; display: flex; align-items: center; gap: 10px;
  }
  .group-title::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .group-title .count { font-weight: 400; color: var(--muted); font-size: 13px; }
  .group-title .sort-toggle {
    color: var(--accent); text-decoration: underline dotted; cursor: pointer;
  }
  .group-title .sort-toggle:hover { text-decoration: underline solid; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
  .grid .item {
    display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
    padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--panel); cursor: pointer; font-size: 14px;
  }
  .grid .item:hover { border-color: var(--accent); }
  .grid .item .n { font-family: var(--serif); }
  .grid .item .c { color: var(--muted); font-size: 12px; }
  /* 單字國名：左側青碧細線，提示「與姓氏同形、判定非絕對」 */
  .grid .item.char-place {
    border-left: 3px solid var(--place);
    background: linear-gradient(to right, var(--place-soft), var(--panel) 38%);
  }
  .grid .item.char-place .n { color: var(--place); }

  /* ---- 篇目一覽 ---- */
  .book-title {
    margin: 26px 0 10px; font-size: 15px; font-weight: 600; color: var(--accent);
    letter-spacing: 1px; border-left: 3px solid var(--accent); padding-left: 10px;
  }
  .book-title .count { font-weight: 400; color: var(--muted); font-size: 13px; margin-left: 8px; }
  .chap-row {
    display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
    padding: 9px 12px; border-bottom: 1px dashed var(--border); cursor: pointer;
  }
  .chap-row:last-child { border-bottom: none; }
  .chap-row:hover .n { color: var(--accent); }
  .chap-row .n { font-family: var(--serif); font-size: 15px; }
  .chap-row .meta { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .chap-row .cat {
    font-family: var(--serif); font-size: 11px; color: var(--muted);
    border: 1px solid var(--border); border-radius: 5px; padding: 0 6px; margin-left: 8px;
  }
  /* 篇主 / 高頻地名：與 .cat 同形但換色，讓「這一類」和「這一篇講誰」分得開 */
  .chap-row .tag {
    font-family: var(--serif); font-size: 11px; color: var(--accent-soft, #8a6d3b);
    background: var(--panel); border-radius: 5px; padding: 0 6px; margin-left: 6px;
  }

  /* 原文層 */
  .reader { position: fixed; inset: 0; background: rgba(43,42,39,.35); display: none; z-index: 20; }
  .reader.on { display: block; }
  .reader-inner {
    position: absolute; right: 0; top: 0; bottom: 0; width: min(760px, 92%);
    background: var(--bg); border-left: 1px solid var(--border);
    display: flex; flex-direction: column;
  }
  .reader-head {
    padding: 14px 18px; border-bottom: 1px solid var(--border);
    background: var(--panel); display: flex; justify-content: space-between; align-items: center;
  }
  .reader-head .t { font-family: var(--serif); font-size: 16px; }
  .reader-head button {
    font-family: var(--sans); font-size: 13px; padding: 5px 11px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--panel); color: var(--muted); cursor: pointer;
  }
  /* 句級編輯（P4-2）：hover 出三個小動作，點「拆分」後**點字選斷點**——
     比彈窗填數字直覺得多：想在哪斷，就點那個字。 */
  .reader-body p { position: relative; }
  .acts { display: none; margin-left: 8px; font-family: var(--sans); }
  .reader-body p:hover .acts { display: inline; }
  .acts button {
    font-size: 11px; padding: 1px 7px; margin-left: 3px;
    border: 1px solid var(--border); border-radius: 6px;
    background: var(--panel); color: var(--muted); cursor: pointer;
  }
  .acts button:hover { border-color: var(--accent); color: var(--accent); }
  .reader-body p.picking { background: var(--accent-soft); }
  .reader-body p.picking .ch { cursor: pointer; }
  .reader-body p.picking .ch:hover { background: var(--accent); color: #fff; }
  .reader-body p.edited { opacity: .55; }
  .reader-body p.edited::after {
    content: "已記錄，待重建"; font-family: var(--sans); font-size: 11px;
    color: var(--accent); margin-left: 8px;
  }
  .reader-head .edstat { font-size: 12px; color: var(--accent); margin-right: auto; }
  .reader-head .head-acts { display: flex; gap: 6px; align-items: center; }
  .reader-head button[hidden] { display: none; }
  /* 跳段：段號輸入 + 總段數。只在長篇（> 40 段）出現，短篇加了是噪聲 */
  .reader-head .jumpbox { display: flex; gap: 4px; align-items: center; }
  .reader-head .jumpbox[hidden] { display: none; }
  .reader-head .jumpbox input {
    width: 64px; font-size: 13px; padding: 5px 8px; text-align: right;
    font-family: var(--mono);
  }
  .reader-head .jump-total { font-size: 12px; color: var(--muted); }
  /* 「只看相關段落」開啟時的正文底色，與 target（定位命中）區分開 */
  .reader-body p.hitpara { background: var(--accent-soft); }
  /* 注文（裴注 / 晉書舊史注）：**獨立賬本**，視覺上要和正文命中分得開。
     用青灰（--muted 系）而不是朱砂，朱砂只給正文命中與關係。 */
  .note-sum {
    margin: 12px 0 4px; font-size: 13px; color: var(--muted);
    padding: 8px 12px; background: var(--panel); border-radius: 8px;
    border-left: 3px solid var(--border);
  }
  .note-sum b { color: var(--ink); font-weight: 500; }
  .note-chip {
    color: #2f6d7a !important; background: rgba(47,109,122,.10);
    padding: 1px 7px; border-radius: 5px; font-family: var(--mono);
  }
  .note-warn { color: var(--muted); opacity: .85; }
  .pei-line {
    font-family: var(--serif); font-size: 14.5px; line-height: 1.9;
    color: #4a5a5e; padding: 7px 10px; margin-bottom: 6px; cursor: pointer;
    background: rgba(47,109,122,.05); border-radius: 6px;
    border-left: 2px solid rgba(47,109,122,.30);
  }
  .pei-line:hover { background: rgba(47,109,122,.11); }

  .reader-body { flex: 1; overflow-y: auto; padding: 16px 20px 40px; }
  .reader-body p {
    font-family: var(--serif); font-size: 15px; line-height: 1.95;
    margin: 0 0 10px; color: var(--text);
  }
  .reader-body p.target { background: var(--accent-soft); }
  /* 跨句對話續接（docs/21 §13）：只做顯示層，切分不動。
     q-cont＝承接上一句仍未收口的對話（左側點線＋縮進）；
     q-open＝本句話沒說完，與下一句貼緊（下方不留白）。 */
  .reader-body p.q-cont { padding-left: 14px; border-left: 2px dotted var(--border); }
  .reader-body p.q-open { margin-bottom: 0; }
</style>
</head>
<body>
<header>
  <button id="back" class="backbtn" hidden>← 返回</button>
  <h1>古籍檢索</h1>
  <p class="sub" id="sub">史記 · 漢書 · 後漢書 · 三國志 · 晉書</p>
</header>

<div class="wrap">
  <div class="bookbar" id="books"></div>
  <div class="searchbar">
    <input id="q" type="text" list="names" placeholder="輸入人名／稱謂／地名，如 劉邦、梁王、霍光、滎陽" autocomplete="off">
    <!-- 候選由 /api/index 回來的人名 + 地名現填：換書就跟著換，
         不會在漢書裡推薦一個只出現在晉書的人 -->
    <datalist id="names"></datalist>
    <button id="btn">檢索</button>
  </div>
  <div class="modes">
    <span data-mode="person" class="on">人物檢索</span>
    <span data-mode="fts">全文檢索</span>
  </div>
  <div class="quick" id="quick"></div>
  <div class="tabs">
    <span data-tab="search" class="on">檢索結果</span>
    <span data-tab="persons">人物索引</span>
    <span data-tab="places">地名索引</span>
    <span data-tab="chapters">篇目一覽</span>
  </div>
  <div id="out"></div>
  <div class="hint" id="hint"></div>
</div>

<div class="reader" id="reader">
  <div class="reader-inner">
    <div class="reader-head">
      <span class="t" id="readerTitle"></span>
      <span class="edstat" id="edstat" hidden></span>
      <span class="head-acts">
        <span class="jumpbox" id="jumpBox" hidden>
          <input type="number" id="jumpInput" min="1" step="1" placeholder="段號">
          <span class="jump-total" id="jumpTotal"></span>
          <button data-act="jump">跳段</button>
        </span>
        <button data-act="hits" id="btnHits" hidden>只看相關段落</button>
        <button id="btnRebuild" hidden>重建</button>
        <button data-act="close">關閉</button>
      </span>
    </div>
    <div class="reader-body" id="readerBody"></div>
  </div>
</div>

<!-- ⚠️ 相對路徑，不是 /app.js：dist/ 離線版要能 file:// 双击打开，
     絕對路徑會指到 file:///app.js 去。聯機時頁面在 / 下，相對路徑一樣解析成 /app.js。 -->
<script src="app.js"></script>
</body>
</html>
